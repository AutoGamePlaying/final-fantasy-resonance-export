name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: ${{ matrix.os == 'ubuntu-latest' && 'clippy, rustfmt' || 'clippy' }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-

      - name: Run check script
        shell: bash
        run: |
          if [[ -e .deps ]]; then
            echo "Error: .deps directory must not exist in the CI workspace" >&2
            exit 1
          fi
          bash scripts/check.sh

      - name: Self-test GUI binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $guiExe = "src/FfrExport.Gui/bin/Release/net10.0-windows/ffr-export-gui.exe"
          if (-not (Test-Path -LiteralPath $guiExe -PathType Leaf)) {
            throw "Error: built GUI executable not found: $guiExe"
          }
          $workDir = Join-Path ([System.IO.Path]::GetTempPath()) ("ffr-gui-selftest-" + [System.Guid]::NewGuid().ToString("N"))
          $deniedTempDir = Join-Path $workDir "denied-temp"
          New-Item -ItemType Directory -Path $workDir, $deniedTempDir -Force | Out-Null
          $stderrFile = Join-Path $workDir "stderr.log"
          $previousTemp = $env:TEMP
          $hadTemp = Test-Path Env:TEMP
          $previousTmp = $env:TMP
          $hadTmp = Test-Path Env:TMP
          try {
            & icacls $deniedTempDir /deny '*S-1-1-0:(OI)(CI)(WD,AD,WEA,WA)' | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Error: icacls failed to apply deny-write ACL on temp directory: $deniedTempDir (exit code $LASTEXITCODE)"
            }
            $aclBlocked = $false
            try {
              [System.IO.File]::WriteAllText((Join-Path $deniedTempDir "acl-probe.tmp"), "blocked")
            } catch [System.UnauthorizedAccessException] {
              $aclBlocked = $true
            }
            if (-not $aclBlocked) {
              throw "Error: icacls deny-write ACL did not take effect; file write still succeeded in $deniedTempDir"
            }

            $env:TEMP = $deniedTempDir
            $env:TMP = $deniedTempDir
            # WinExe (GUI subsystem): `& exe` does not wait and leaves $LASTEXITCODE unset, so wait explicitly.
            $selfTest = Start-Process -FilePath $guiExe -ArgumentList @('--self-test') -Wait -PassThru -NoNewWindow -RedirectStandardError $stderrFile
            $selfTestExit = $selfTest.ExitCode
            if ($selfTestExit -ne 0) {
              if (Test-Path -LiteralPath $stderrFile -PathType Leaf) {
                $stderrText = Get-Content -LiteralPath $stderrFile -Raw -Encoding UTF8
                if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
                  [Console]::Error.WriteLine($stderrText)
                }
              }
              throw "Error: ffr-export-gui.exe --self-test failed with icacls deny-write TEMP (exit code $selfTestExit)"
            }
            # Lift the deny ACE before inspecting the directory; the check itself must not be blocked by it.
            & icacls $deniedTempDir /remove:d '*S-1-1-0' | Out-Null
            $leakedTempFiles = @(Get-ChildItem -LiteralPath $deniedTempDir -Force)
            if ($leakedTempFiles.Count -ne 0) {
              throw "Error: unexpected files appeared inside deny-write TEMP directory: $($leakedTempFiles.Name -join ', ')"
            }
          } finally {
            if ($hadTemp) { $env:TEMP = $previousTemp } else { Remove-Item Env:TEMP -ErrorAction SilentlyContinue }
            if ($hadTmp) { $env:TMP = $previousTmp } else { Remove-Item Env:TMP -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $deniedTempDir) {
              & icacls $deniedTempDir /remove:d '*S-1-1-0' 2>$null | Out-Null
            }
            if (Test-Path -LiteralPath $workDir) {
              Remove-Item -LiteralPath $workDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "GUI self-test passed (icacls deny-write TEMP simulation): $guiExe --self-test"

      - name: Simulate UE4SS cleanup access denied (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cliExe = "src/FfrExport/bin/Release/net10.0/FfrExport.exe"
          if (-not (Test-Path -LiteralPath $cliExe -PathType Leaf)) {
            throw "Error: built CLI executable not found: $cliExe"
          }
          $workDir = Join-Path ([System.IO.Path]::GetTempPath()) ("ffr-ue4ss-deny-" + [System.Guid]::NewGuid().ToString("N"))
          $gameDir = Join-Path $workDir "Game"
          $paksDir = Join-Path $gameDir "FFRS\Content\Paks"
          $win64Dir = Join-Path $gameDir "FFRS\Binaries\Win64"
          $ue4ssDir = Join-Path $win64Dir "ue4ss"
          $agpHome = Join-Path $workDir "agp-home"
          $denyResultFile = Join-Path $workDir "deny-result.json"
          $retryResultFile = Join-Path $workDir "retry-result.json"
          $stdoutFile = Join-Path $workDir "stdout.log"
          $stderrFile = Join-Path $workDir "stderr.log"
          $aclApplied = $false
          try {
            New-Item -ItemType Directory -Path $paksDir, $ue4ssDir, $agpHome -Force | Out-Null
            [System.IO.File]::WriteAllBytes((Join-Path $win64Dir "FFRS-Win64-Shipping.exe"), [byte[]](0x4D, 0x5A))
            [System.IO.File]::WriteAllText((Join-Path $win64Dir "dwmapi.dll"), "synthetic-dwmapi")
            [System.IO.File]::WriteAllText((Join-Path $ue4ssDir "UE4SS.dll"), "synthetic-ue4ss")
            $markerPath = Join-Path $ue4ssDir ".installed-by-ffr-export.json"
            $markerJson = '{"format":1,"installed_by":"ffr-export","ue4ss_version":"v4.0.0","source_url":"https://example.invalid","archive_sha256":"0000","installed_at":"2026-11-27T00:00:00Z","files":["dwmapi.dll","ue4ss/.installed-by-ffr-export.json","ue4ss/UE4SS.dll"],"directories":["ue4ss"]}'
            [System.IO.File]::WriteAllText($markerPath, $markerJson, [System.Text.UTF8Encoding]::new($false))

            & icacls $ue4ssDir /deny '*S-1-1-0:(OI)(CI)(DE,DC)' | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Error: icacls failed to apply deny-delete ACL on $ue4ssDir (exit code $LASTEXITCODE)"
            }
            $aclApplied = $true

            $denyProc = Start-Process -FilePath $cliExe -ArgumentList @(
              '--lang', 'en',
              'uninstall-ue4ss',
              '--game', $gameDir,
              '--yes',
              '--agp-home', $agpHome,
              '--result-file', $denyResultFile
            ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            if ($denyProc.ExitCode -ne 5) {
              throw "Error: expected exit code 5 (needs_elevation), got $($denyProc.ExitCode)"
            }
            $stdoutText = Get-Content -LiteralPath $stdoutFile -Raw -Encoding UTF8
            if (-not $stdoutText.Contains('@@ue4ss-cleanup ') -or -not $stdoutText.Contains('"status":"needs_elevation"') -or -not $stdoutText.Contains('"reason":"access_denied"')) {
              throw "Error: stdout missing expected @@ue4ss-cleanup needs_elevation line: $stdoutText"
            }
            if (-not (Test-Path -LiteralPath $denyResultFile -PathType Leaf)) {
              throw "Error: result file was not written: $denyResultFile"
            }
            $denyResult = Get-Content -LiteralPath $denyResultFile -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($denyResult.status -ne 'needs_elevation' -or $denyResult.exit_code -ne 5 -or $denyResult.reason -ne 'access_denied' -or [string]::IsNullOrWhiteSpace($denyResult.blocked_path)) {
              throw "Error: unexpected deny result JSON: $(Get-Content -LiteralPath $denyResultFile -Raw -Encoding UTF8)"
            }
            if (-not (Test-Path -LiteralPath $markerPath -PathType Leaf)) {
              throw "Error: install marker should remain intact after access-denied failure"
            }

            & icacls $ue4ssDir /remove:d '*S-1-1-0' | Out-Null
            $aclApplied = $false

            $retryProc = Start-Process -FilePath $cliExe -ArgumentList @(
              '--lang', 'en',
              'uninstall-ue4ss',
              '--game', $gameDir,
              '--yes',
              '--agp-home', $agpHome,
              '--result-file', $retryResultFile
            ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            if ($retryProc.ExitCode -ne 0) {
              throw "Error: retry uninstall-ue4ss failed with exit code $($retryProc.ExitCode)"
            }
            $retryResult = Get-Content -LiteralPath $retryResultFile -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($retryResult.status -ne 'completed' -or $retryResult.exit_code -ne 0) {
              throw "Error: unexpected retry result JSON: $(Get-Content -LiteralPath $retryResultFile -Raw -Encoding UTF8)"
            }
            if ((Test-Path -LiteralPath $markerPath) -or (Test-Path -LiteralPath $ue4ssDir)) {
              throw "Error: UE4SS files or directory still exist after retry cleanup"
            }
            Write-Host "UE4SS cleanup access-denied simulation passed (icacls deny DE/DC -> exit 5 -> retry -> exit 0)"
          } finally {
            if ($aclApplied -and (Test-Path -LiteralPath $ue4ssDir)) {
              & icacls $ue4ssDir /remove:d '*S-1-1-0' 2>$null | Out-Null
            }
            if (Test-Path -LiteralPath $workDir) {
              Remove-Item -LiteralPath $workDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

  fixture-hash:
    name: Fixture Hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Disable Git autocrlf and configure .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-fixture-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fixture-cargo-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-

      - name: Build fixture database and compute hash
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          bash scripts/fixture-db.sh --hash-out "${RUNNER_TEMP}/fixture-hash-${MATRIX_OS}.json"

      - name: Run synthetic export and collect file SHA-256 manifest
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          bash scripts/fixture-export.sh --manifest-out "${RUNNER_TEMP}/fixture-export-${MATRIX_OS}.json"

      - name: Upload fixture hash report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-hash-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture-hash-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload fixture export manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-export-${{ matrix.os }}
          path: ${{ runner.temp }}/fixture-export-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 7

  compare-hash:
    name: Compare Cross-Platform Hashes
    needs: fixture-hash
    runs-on: ubuntu-latest
    steps:
      - name: Download fixture hash reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fixture-hash-*
          path: ${{ runner.temp }}/hashes
          merge-multiple: true

      - name: Download fixture export manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fixture-export-*
          path: ${{ runner.temp }}/exports
          merge-multiple: true

      - name: Compare Linux and Windows database hashes
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/hashes/fixture-hash-ubuntu-latest.json" "${RUNNER_TEMP}/hashes/fixture-hash-windows-latest.json" <<'PY'
          import json
          import sys

          linux_path, win_path = sys.argv[1], sys.argv[2]
          with open(linux_path, "r", encoding="utf-8") as f:
              linux_data = json.load(f)
          with open(win_path, "r", encoding="utf-8") as f:
              win_data = json.load(f)

          print(f"Linux   file_sha256:    {linux_data['file_sha256']}")
          print(f"Windows file_sha256:    {win_data['file_sha256']}")
          print(f"Linux   content_sha256: {linux_data['content_sha256']}")
          print(f"Windows content_sha256: {win_data['content_sha256']}")
          print(f"Linux   sqlite_version: {linux_data.get('sqlite_version')} (schema v{linux_data.get('schema_version')})")
          print(f"Windows sqlite_version: {win_data.get('sqlite_version')} (schema v{win_data.get('schema_version')})")

          diffs = []
          for field in ("file_sha256", "content_sha256", "schema_version"):
              if linux_data.get(field) != win_data.get(field):
                  diffs.append(f"Field '{field}' mismatch: Linux={linux_data.get(field)} vs Windows={win_data.get(field)}")

          linux_tables = {t["name"]: t for t in linux_data.get("tables", [])}
          win_tables = {t["name"]: t for t in win_data.get("tables", [])}
          all_names = sorted(set(linux_tables) | set(win_tables))

          diff_tables = []
          for name in all_names:
              lt = linux_tables.get(name)
              wt = win_tables.get(name)
              if lt is None:
                  diff_tables.append(f"  - {name}: missing on Linux, Windows rows={wt['rows']} sha256={wt['sha256']}")
              elif wt is None:
                  diff_tables.append(f"  - {name}: missing on Windows, Linux rows={lt['rows']} sha256={lt['sha256']}")
              elif lt["rows"] != wt["rows"] or lt["sha256"] != wt["sha256"]:
                  diff_tables.append(
                      f"  - {name}: Linux(rows={lt['rows']}, sha256={lt['sha256']}) != "
                      f"Windows(rows={wt['rows']}, sha256={wt['sha256']})"
                  )

          if diffs or diff_tables:
              print("Error: Linux and Windows synthetic database hashes do not match!", file=sys.stderr)
              for line in diffs:
                  print(line, file=sys.stderr)
              if diff_tables:
                  print(f"Tables with differences ({len(diff_tables)}):", file=sys.stderr)
                  for line in diff_tables:
                      print(line, file=sys.stderr)
              sys.exit(1)

          print(f"Hash verification passed: Linux and Windows match across all {len(all_names)} tables.")
          PY

      - name: Compare Linux and Windows export file manifests
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/exports/fixture-export-ubuntu-latest.json" "${RUNNER_TEMP}/exports/fixture-export-windows-latest.json" <<'PY'
          import json
          import sys

          linux_path, win_path = sys.argv[1], sys.argv[2]
          with open(linux_path, "r", encoding="utf-8") as f:
              linux_data = json.load(f)
          with open(win_path, "r", encoding="utf-8") as f:
              win_data = json.load(f)

          linux_files = {item["path"]: item for item in linux_data.get("files", [])}
          win_files = {item["path"]: item for item in win_data.get("files", [])}
          all_paths = sorted(set(linux_files) | set(win_files))

          print(f"Linux   export files: {len(linux_files)} ({linux_data.get('os')})")
          print(f"Windows export files: {len(win_files)} ({win_data.get('os')})")

          if not all_paths:
              print("Error: synthetic export manifest is empty!", file=sys.stderr)
              sys.exit(1)

          diff_files = []
          for rel_path in all_paths:
              lf = linux_files.get(rel_path)
              wf = win_files.get(rel_path)
              if lf is None:
                  diff_files.append(f"  - {rel_path}: missing on Linux, Windows size={wf['size']} sha256={wf['sha256']}")
              elif wf is None:
                  diff_files.append(f"  - {rel_path}: missing on Windows, Linux size={lf['size']} sha256={lf['sha256']}")
              else:
                  mismatches = []
                  for key in ("sha256", "size", "has_cr", "has_bom", "normalized_volatile"):
                      if lf.get(key) != wf.get(key):
                          mismatches.append(f"{key}: Linux={lf.get(key)} != Windows={wf.get(key)}")
                  if mismatches:
                      diff_files.append(f"  - {rel_path}: " + "; ".join(mismatches))

          if diff_files:
              print(f"Error: Linux and Windows synthetic export manifests differ ({len(diff_files)} file(s)):", file=sys.stderr)
              for line in diff_files:
                  print(line, file=sys.stderr)
              sys.exit(1)

          print(f"Export verification passed: all {len(all_paths)} output files match SHA-256 across Linux and Windows.")
          PY

  package-windows:
    name: Package Windows (win-x64)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
            echo "AGP_HOME=${RUNNER_TEMP}/agp-home"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package version and short commit SHA
        id: meta
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "Error: VERSION file is missing at repository root" >&2
            exit 1
          fi
          VERSION_VAL="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION_VAL" ]]; then
            echo "Error: VERSION file is empty" >&2
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          {
            echo "version=${VERSION_VAL}"
            echo "short_sha=${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "==> Package version: ${VERSION_VAL} (short SHA: ${SHORT_SHA})"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-package-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-package-cargo-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-

      - name: Package Windows native archive
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/package-windows.ps1 -Version "$env:PACKAGE_VERSION"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/ffr-export-$($env:PACKAGE_VERSION)-win-x64.zip"
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
          } finally {
            $zip.Dispose()
          }
          foreach ($expected in @("ffr-export-gui.exe", "ffr-export.exe", "ffr-db.exe", "known-builds.json", "README-Windows.txt", "SHA256SUMS")) {
            if ($names -notcontains $expected) {
              throw "Error: archive $zipPath is missing required file: $expected"
            }
          }
          Write-Host "Archive contents verified: $($names -join ', ')"

      - name: Self-test packaged single-file binaries with unwritable TEMP
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/ffr-export-$($env:PACKAGE_VERSION)-win-x64.zip"
          $workDir = Join-Path ([System.IO.Path]::GetTempPath()) ("ffr-pkg-selftest-" + [System.Guid]::NewGuid().ToString("N"))
          $extractDir = Join-Path $workDir "extracted"
          $stderrFile = Join-Path $workDir "gui-stderr.log"
          $cliOutFile = Join-Path $workDir "cli-help-stdout.log"
          $cliErrFile = Join-Path $workDir "cli-help-stderr.log"
          $dbOutFile = Join-Path $workDir "db-help-stdout.log"
          $dbErrFile = Join-Path $workDir "db-help-stderr.log"
          $deniedTempDir = Join-Path $workDir "denied-temp"
          $selfTestAgpHome = Join-Path $workDir "agp-home"

          $previousTemp = $env:TEMP
          $hadTemp = Test-Path Env:TEMP
          $previousTmp = $env:TMP
          $hadTmp = Test-Path Env:TMP
          $previousAgp = $env:AGP_HOME
          $hadAgp = Test-Path Env:AGP_HOME
          $previousLang = $env:AGP_LANG
          $hadLang = Test-Path Env:AGP_LANG
          try {
            New-Item -ItemType Directory -Path $extractDir, $selfTestAgpHome, $deniedTempDir -Force | Out-Null
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $extractDir)

            $packagedGuiExe = Join-Path $extractDir "ffr-export-gui.exe"
            $packagedCliExe = Join-Path $extractDir "ffr-export.exe"
            $packagedDbExe = Join-Path $extractDir "ffr-db.exe"
            foreach ($bin in @($packagedGuiExe, $packagedCliExe, $packagedDbExe)) {
              if (-not (Test-Path -LiteralPath $bin -PathType Leaf)) {
                throw "Error: extracted archive is missing executable: $bin"
              }
            }

            # Apply an explicit deny-write NTFS ACL to an existing temp directory via icacls.
            & icacls $deniedTempDir /deny '*S-1-1-0:(OI)(CI)(WD,AD,WEA,WA)' | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Error: icacls failed to apply deny-write ACL on temp directory: $deniedTempDir (exit code $LASTEXITCODE)"
            }
            $aclBlocked = $false
            try {
              [System.IO.File]::WriteAllText((Join-Path $deniedTempDir "acl-probe.tmp"), "blocked")
            } catch [System.UnauthorizedAccessException] {
              $aclBlocked = $true
            }
            if (-not $aclBlocked) {
              throw "Error: icacls deny-write ACL did not take effect; file write still succeeded in $deniedTempDir"
            }

            $env:TEMP = $deniedTempDir
            $env:TMP = $deniedTempDir
            $env:AGP_HOME = $selfTestAgpHome
            Remove-Item Env:AGP_LANG -ErrorAction SilentlyContinue

            # 1. GUI self-test (WinExe requires explicit Start-Process -Wait)
            $selfTest = Start-Process -FilePath $packagedGuiExe -ArgumentList @('--self-test') -Wait -PassThru -NoNewWindow -RedirectStandardError $stderrFile
            if ($selfTest.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $stderrFile -PathType Leaf) {
                $stderrText = Get-Content -LiteralPath $stderrFile -Raw -Encoding UTF8
                if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
                  [Console]::Error.WriteLine($stderrText)
                }
              }
              throw "Error: packaged ffr-export-gui.exe --self-test failed with icacls deny-write TEMP (exit code $($selfTest.ExitCode))"
            }

            # 2. CLI --help in all three languages (en, zh-Hans, ja)
            $langChecks = @(
              @{ Code = 'en'; Expected = 'Usage:' },
              @{ Code = 'zh-Hans'; Expected = '用法' },
              @{ Code = 'ja'; Expected = '使い方:' }
            )
            foreach ($check in $langChecks) {
              $cliArgs = if ($check.Code -eq 'en') { @('--help') } else { @('--lang', $check.Code, '--help') }
              $cliHelp = Start-Process -FilePath $packagedCliExe -ArgumentList $cliArgs -Wait -PassThru -NoNewWindow -RedirectStandardOutput $cliOutFile -RedirectStandardError $cliErrFile
              if ($cliHelp.ExitCode -ne 0) {
                if (Test-Path -LiteralPath $cliErrFile -PathType Leaf) {
                  [Console]::Error.WriteLine((Get-Content -LiteralPath $cliErrFile -Raw -Encoding UTF8))
                }
                throw "Error: packaged ffr-export.exe ($($check.Code)) --help failed with icacls deny-write TEMP (exit code $($cliHelp.ExitCode))"
              }
              $helpOut = Get-Content -LiteralPath $cliOutFile -Raw -Encoding UTF8
              if (-not $helpOut.Contains($check.Expected)) {
                throw "Error: packaged ffr-export.exe ($($check.Code)) --help output did not contain expected localized marker."
              }
            }

            # 3. ffr-db --help
            $dbHelp = Start-Process -FilePath $packagedDbExe -ArgumentList @('--help') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $dbOutFile -RedirectStandardError $dbErrFile
            if ($dbHelp.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $dbErrFile -PathType Leaf) {
                [Console]::Error.WriteLine((Get-Content -LiteralPath $dbErrFile -Raw -Encoding UTF8))
              }
              throw "Error: packaged ffr-db.exe --help failed with icacls deny-write TEMP (exit code $($dbHelp.ExitCode))"
            }

            # Lift the deny ACE before inspecting the directory; the check itself must not be blocked by it.
            & icacls $deniedTempDir /remove:d '*S-1-1-0' | Out-Null
            $leakedTempFiles = @(Get-ChildItem -LiteralPath $deniedTempDir -Force)
            if ($leakedTempFiles.Count -ne 0) {
              throw "Error: unexpected files appeared inside deny-write TEMP directory: $($leakedTempFiles.Name -join ', ')"
            }

            Write-Host "Packaged single-file self-test passed (icacls deny-write TEMP/TMP): ffr-export-gui.exe --self-test, ffr-export.exe --help (en/zh-Hans/ja), ffr-db.exe --help"
          } finally {
            if ($hadTemp) { $env:TEMP = $previousTemp } else { Remove-Item Env:TEMP -ErrorAction SilentlyContinue }
            if ($hadTmp) { $env:TMP = $previousTmp } else { Remove-Item Env:TMP -ErrorAction SilentlyContinue }
            if ($hadAgp) { $env:AGP_HOME = $previousAgp } else { Remove-Item Env:AGP_HOME -ErrorAction SilentlyContinue }
            if ($hadLang) { $env:AGP_LANG = $previousLang } else { Remove-Item Env:AGP_LANG -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $deniedTempDir) {
              & icacls $deniedTempDir /remove:d '*S-1-1-0' 2>$null | Out-Null
            }
            if (Test-Path -LiteralPath $workDir) {
              Remove-Item -LiteralPath $workDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffr-export-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}-win-x64
          path: dist/ffr-export-${{ steps.meta.outputs.version }}-win-x64.zip
          if-no-files-found: error
          retention-days: 30
