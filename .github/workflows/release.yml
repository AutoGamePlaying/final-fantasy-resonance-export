name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and Release (win-x64)
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Configure Git line endings and .NET cache paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          {
            echo "DOTNET_CLI_HOME=${RUNNER_TEMP}/dotnet-home"
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/nuget"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/nuget-http"
          } >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches VERSION file
        shell: bash
        run: |
          if [[ ! -f VERSION ]]; then
            echo "错误：仓库根目录缺少 VERSION 文件" >&2
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$TAG_VERSION" || "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "错误：tag 版本（${TAG_NAME} -> ${TAG_VERSION}）与 VERSION 文件（${FILE_VERSION}）不一致" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${FILE_VERSION}" >> "${GITHUB_ENV}"
          echo "==> 版本校验通过：${TAG_NAME}（VERSION=${FILE_VERSION}）"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-cargo-

      - name: Run check script
        shell: bash
        run: |
          if [[ -e .deps ]]; then
            echo "错误：发布工作区中不应存在 .deps 目录" >&2
            exit 1
          fi
          bash scripts/check.sh

      - name: Package Windows native release
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Version "$env:RELEASE_VERSION"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/ffr-export-$($env:RELEASE_VERSION)-win-x64.zip"
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
          } finally {
            $zip.Dispose()
          }
          foreach ($expected in @("ffr-export-gui.exe", "ffr-export.exe", "ffr-db.exe", "known-builds.json", "使用说明.txt", "SHA256SUMS")) {
            if ($names -notcontains $expected) {
              throw "错误：发布压缩包 $zipPath 缺少必需文件：$expected"
            }
          }

      - name: Self-test packaged single-file GUI binary
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/ffr-export-$($env:RELEASE_VERSION)-win-x64.zip"
          $extractDir = Join-Path ([System.IO.Path]::GetTempPath()) ("ffr-rel-selftest-" + [System.Guid]::NewGuid().ToString("N"))
          $stderrFile = Join-Path ([System.IO.Path]::GetTempPath()) ("ffr-rel-selftest-stderr-" + [System.Guid]::NewGuid().ToString("N") + ".log")
          try {
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $extractDir)
            $packagedGuiExe = Join-Path $extractDir "ffr-export-gui.exe"
            if (-not (Test-Path -LiteralPath $packagedGuiExe -PathType Leaf)) {
              throw "错误：解压后的发布压缩包缺少窗口程序：$packagedGuiExe"
            }
            # WinExe (GUI subsystem): wait explicitly with Start-Process and capture stderr on failure.
            $selfTest = Start-Process -FilePath $packagedGuiExe -ArgumentList @('--self-test') -Wait -PassThru -NoNewWindow -RedirectStandardError $stderrFile
            $selfTestExit = $selfTest.ExitCode
            if ($selfTestExit -ne 0) {
              if (Test-Path -LiteralPath $stderrFile -PathType Leaf) {
                $stderrText = Get-Content -LiteralPath $stderrFile -Raw -Encoding UTF8
                if (-not [string]::IsNullOrWhiteSpace($stderrText)) {
                  [Console]::Error.WriteLine($stderrText)
                }
              }
              throw "错误：发布压缩包内的单文件 ffr-export-gui.exe --self-test 失败（退出码 $selfTestExit）"
            }
            Write-Host "发布压缩包单文件窗口自检通过：$packagedGuiExe --self-test"
          } finally {
            if (Test-Path -LiteralPath $stderrFile) {
              Remove-Item -LiteralPath $stderrFile -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $extractDir) {
              Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Prepare Release notes
        shell: bash
        run: |
          ZIP_NAME="ffr-export-${RELEASE_VERSION}-win-x64.zip"
          for required in "dist/${ZIP_NAME}" "dist/SHA256SUMS" "dist/known-builds.json"; do
            if [[ ! -f "$required" ]]; then
              echo "错误：缺少发布产物：$required" >&2
              exit 1
            fi
          done

          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## 说明

          - 本发布包**不含任何游戏数据**（仅包含导出与建库工具本体、校验文件与已知构建清单）。
          - \`.usmap\` 映射文件需要用户自行用 UE4SS 从运行中的游戏里转储（默认保存在游戏目录 \`FFRS\\Binaries\\Win64\\ue4ss\\\` 下）。
          - 构建完成后，工具会自动将生成的数据库与 \`known-builds.json\` 中的已知构建记录进行哈希比对（同时登记了“只有 \`.usmap\`”与“\`.usmap\` 加两份 \`.jmap\`”两种输入组合）。

          ## 快速使用（Windows）

          1. 下载 \`${ZIP_NAME}\` 并用 \`SHA256SUMS\` 校验完整性后，完整解压到同一个文件夹；
          2. 双击运行 **\`ffr-export-gui.exe\`**（图形界面）：
             - 自动扫描 Steam 游戏库并查找最新的 \`.usmap\`；
             - 确认输出位置后点击 **开始导出** 即可生成 \`ffr.sqlite\` 并查看版本比对结果。
          3. 如需命令行方式，可在解压目录运行：

          \`\`\`powershell
          ffr-export build-db --game "<Steam 游戏目录>" --usmap <文件>
          \`\`\`

          ## 附件

          - \`${ZIP_NAME}\`：Windows x64 原生单文件版 \`ffr-export-gui.exe\`、\`ffr-export.exe\`、\`ffr-db.exe\`、\`known-builds.json\`、\`使用说明.txt\`、\`SHA256SUMS\`、\`README.md\`、\`LICENSE\`
          - \`SHA256SUMS\`：发布附件的 SHA-256 校验值
          - \`known-builds.json\`：已登记的游戏版本与数据库哈希清单
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          token: ${{ github.token }}
          files: |
            dist/ffr-export-${{ env.RELEASE_VERSION }}-win-x64.zip
            dist/SHA256SUMS
            dist/known-builds.json
